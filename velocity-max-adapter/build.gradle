plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

android {
    namespace 'com.applovin.mediation.adapters.velocity'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34

        buildConfigField("String", "ADAPTER_VERSION", "\"${adapterVersion}\"")
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    compileOnly 'com.applovin:applovin-sdk:12.+'
    implementation "io.velocity:ads-sdk:${velocitySdkVersion}"
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = GROUP
                artifactId = ARTIFACT_ID
                version = VERSION_NAME

                pom {
                    name = 'Velocity Ads MAX Adapter'
                    description = 'AppLovin MAX custom network adapter for Velocity Ads SDK'
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                }
            }
        }
        repositories {
            mavenLocal()
        }
    }
}
