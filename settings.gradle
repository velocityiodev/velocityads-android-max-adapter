pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        if (providers.gradleProperty("velocityLocalMaven").orNull == "true") {
            mavenLocal()
        }
        google()
        mavenCentral()
        maven { url "https://artifacts.applovin.com/android" }
    }
}

rootProject.name = "velocityads-android-max-adapter"
include ':velocity-max-adapter'
